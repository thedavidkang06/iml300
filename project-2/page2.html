<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whimsy — Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page2">
    <div id="page">
      <!-- Same layout.js, different class: "layout-scatter" spreads
           every image inside it over the whole window. -->
      <img class="postit" id="post4" src="assets/post4.png" alt="post-it note">
      <div id="scatter" class="layout-scatter">
        <img class="piece" src="assets/letters/w1.png" alt="">
        <img class="piece" src="assets/letters/w2.png" alt="">
        <img class="piece" src="assets/letters/h1.png" alt="">
        <img class="piece" src="assets/letters/h2.png" alt="">
        <img class="piece" src="assets/letters/i1.png" alt="">
        <img class="piece" src="assets/letters/i2.png" alt="">
        <img class="piece" src="assets/letters/m1.png" alt="">
        <img class="piece" src="assets/letters/m2.png" alt="">
        <img class="piece" src="assets/letters/s1.png" alt="">
        <img class="piece" src="assets/letters/s2.png" alt="">
        <img class="piece" src="assets/letters/y1.png" alt="">
        <img class="piece" src="assets/letters/y2.png" alt="">

        <!-- a second set, so the page feels full -->
        <img class="piece" src="assets/letters/w1.png" alt="">
        <img class="piece" src="assets/letters/w2.png" alt="">
        <img class="piece" src="assets/letters/h1.png" alt="">
        <img class="piece" src="assets/letters/h2.png" alt="">
        <img class="piece" src="assets/letters/i1.png" alt="">
        <img class="piece" src="assets/letters/i2.png" alt="">
        <img class="piece" src="assets/letters/m1.png" alt="">
        <img class="piece" src="assets/letters/m2.png" alt="">
        <img class="piece" src="assets/letters/s1.png" alt="">
        <img class="piece" src="assets/letters/s2.png" alt="">
        <img class="piece" src="assets/letters/y1.png" alt="">
        <img class="piece" src="assets/letters/y2.png" alt="">
      </div>
      
 <!-- Sentence 1: hidden until the animation in style.css shows it -->
      <p id="line1" class="sentence">Way to play!</p>

      <!-- Sentence 2 + the PLAY: picture (the picture is a link to the next page) -->
      <p id="line2" class="sentence">When you were a kid, this was all you did:</p>
      <a id="playlink" href="page3.html">
        <img src="assets/play.png" alt="PLAY:">
      </a>

      <a class="nav" href="index.html">&larr; back</a>
    </div>

    <!-- p5.js, then our script -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <script src="layout.js"></script>
  </body>
</html>
