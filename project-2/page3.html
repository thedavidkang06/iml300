<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whimsy — Imagine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page3">
    <div id="page" class="grass">

      <p id="sentence">to imagine without limits</p>
      <a class="nav" href="page2.html">&larr; back</a>

      <div class="item" id= "portal" style="left: 20%; top: 10%; rotate: -20deg;">
        <img class="before" src="assets/hoop.png" alt="hoop">
        <img class="after"  src="assets/portal.png" alt="portal">
      </div>

      <div class="item" style="left: 75%; top: 25%; rotate: 30deg;">
        <img class="before" src="assets/acorns.png" alt="acorns">
        <img class="after"  src="assets/diamonds.png" alt="diamonds">
      </div>

      <div class="item" style="left: 35%; top: 70%; rotate: 10deg;">
        <img class="before" src="assets/stick.png" alt="stick">
        <img class="after"  src="assets/gun.png" alt="gun">
      </div>

      <div class="item" id="cones" style="left: 80%; top: 70%; rotate: -15deg;">
        <img class="before" src="assets/traffic.png" alt="cones">
        <img class="after"  src="assets/ice.png" alt="ice">
      </div>

      <!-- copy and paste more .item blocks to add more -->

      <a class="nav next" href="page4.html">next &rarr;</a>
    </div>

    <script>
      // When an item is clicked, add/remove the class "changed".
      for (let item of document.querySelectorAll(".item")) {
        item.addEventListener("click", () => item.classList.toggle("changed"));
      }
    </script>
  </body>
</html>
