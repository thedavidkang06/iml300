<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whimsy — Imagine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="page3">
    <div id="page" class="sky">

      <p id="sentence">You imagined without limits</p>
      <a class="nav" href="page2.html">&larr; back</a>

     <div class="item" id="cloud1">
     <img class="before" src="assets/dog cloud.png" alt="cloud">
     <img class="after"  src="assets/dog%20draw.png" alt="dog drawing">
     </div>

     <div class="item" id="cloud2">
     <img class="before" src="assets/elephant cloud.png" alt="cloud">
     <img class="after"  src="assets/elephant%20draw.png" alt="elephant drawing">
     </div>

     <div class="item" id="cloud3">
      <img class="before" src="assets/dragon cloud.png" alt="cloud">
      <img class="after"  src="assets/dragon%20draw.png" alt="drawing">
      </div>

      <!-- copy and paste more .item blocks to add more -->

      <a class="nav next" href="page4.html">next &rarr;</a>
    </div>

    <script>
      // When an item is clicked, add/remove the class "changed".
      for (let item of document.querySelectorAll(".item")) {
        item.addEventListener("click", () => item.classList.toggle("changed"));
      }
    </script>
  </body>
</html>
